# Installation resources. Override machine-specific paths in resources.local.yaml.
# Relative paths resolve from this file; ~ expands to the current home directory.
resources:
  ue4_root:
    path: ~/UnrealEngine
  ue4_editor:
    path: ~/UnrealEngine/Engine/Binaries/Linux/UE4Editor
  ue5_root:
    path: ~/UE_installed_build
  ue5_editor:
    path: ~/UE_installed_build/Engine/Binaries/Linux/UnrealEditor
  airsim_source:
    path: ~/AirSim
  airsim_nh:
    path: ~/AirSim/scenes/nh/AirSimNH/Binaries/Linux/AirSimNH
  # Development entry: upstream docs, Python APIs, core and UE implementation.
  # Resolve this resource before browsing; see config/README.md (开发资源导航).
  projectairsim_source:
    path: ~/ProjectAirSim
  projectairsim_blocks:
    path: ~/ProjectAirSim/packages/Blocks/Development/Linux/Blocks/Binaries/Linux/Blocks
  projectairsim_project:
    path: ~/ProjectAirSim/unreal/Blocks/Blocks.uproject
  projectairsim_python:
    path: ../.venv/bin/python
  projectairsim_ros2_setup:
    path: ~/ProjectAirSim/ros2-overlay/install/setup.bash
  projectairsim_course_profile:
    path: ~/aerohub-runtime/projectairsim/course/profile.json
  projectairsim_course_hud:
    path: ~/aerohub-runtime/projectairsim/course/package/Linux/Blocks/Binaries/Linux/Blocks
  projectairsim_weststreet_project:
    path: ~/UE_installed_build/WestStreet/PAirSim.uproject
  airsim_blocks_windows:
    path: ~/AirSim/scenes/blocks/WindowsNoEditor
  airsim_town05:
    path: ~/AirSim/scenes/town05/CarlaUE4/Binaries/Linux/CarlaUE4
  racer_yolo_plant:
    path: ~/AirSim/scenes/plant/SuperGridStarterpack/Binaries/Linux/SuperGridStarterpack-Linux-Shipping
