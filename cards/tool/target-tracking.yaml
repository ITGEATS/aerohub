schema_version: "1.0"
id: tool.target-tracking
version: "0.4.0"
type: tool
name: Target Tracking Tool
description: Observation-only tracking of one query-selected 3D target using the locked YOPO-Tracker EKF. The reserved follow field must be false. Following owns turning and other following motion. Optional ByteTrack association state belongs to each Tracking session. Consumes valid 3D positions; scoped IDs do not guarantee semantic identity. Requires the separately deployed detector and calibrated RGB-D and historical TF.
implementation:
  component_id: aerohub.tool.target-tracking
  manifest: deployment/target_tracking/component.yaml
  shared_runtime: target-tracking-adapter
  coupled_capabilities: []
inputs: []
outputs:
  - id: target_state
    capability_type: perception/target/state/3d
  - id: associated_position
    capability_type: perception/target/associated-position/3d
interfaces:
  - id: track
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_target_tracking_interfaces/action/TrackObject
    parameter_schema: src/tool/target_tracking/interfaces/action/TrackObject.action
lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}
hardware_requirements:
  - hardware_type: compute/cpu/x86-64
resource_access:
  reads: [tools/object_detection/observe, perception/object_detection/detections]
  shared_writes: []
  exclusive_writes: [local/target-tracking-session]
