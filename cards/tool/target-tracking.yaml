schema_version: "1.0"
id: tool.target-tracking
version: "0.1.0"
type: tool
name: Target Tracking Tool
description: Maintains one category-selected 3D target state using serial positioned observations and the locked YOPO-Tracker EKF. Does not navigate or control motion; nearest gated target is not a semantic identity guarantee.
implementation:
  component_id: aerohub.tool.target-tracking
  manifest: deployment/target_tracking/component.yaml
  shared_runtime: target-tracking-adapter
  coupled_capabilities: []
inputs:
  - id: observation
    capability_type: tool/object-detection
outputs: []
interfaces:
  - id: track
    role: functional_operation
    interaction: action
    protocol: ros2_action
    schema: uav_target_tracking_interfaces/action/TrackObject
    parameter_schema: src/tool/target_tracking/interfaces/action/TrackObject.action
lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}
hardware_requirements:
  - hardware_type: compute/cpu/x86-64
resource_access:
  reads: [tools/object_detection/observe]
  shared_writes: []
  exclusive_writes: [local/target-tracking-session]
limitations:
  - External detector requires calibrated RGB-D, capture-time TF and GPU.
  - No global detection arbitration, motion ownership, Mission or following policy.
  - Platform tracking acceptance unfinished; see component validation evidence.
