schema_version: "1.0"
id: planner.aerovla
version: "0.1.0"
type: tool
name: AeroVLA vision-language navigation planner
description: Accepts a single-vehicle navigation goal described by a text object description and target position, runs AeroVLA vision-language inference on front/down RGB observations through a remote NPU worker, and executes discrete policy actions through native GoTo and Land. The Tool preserves action branch ordering and waits for measured position/yaw/speed convergence. The Registry entry uses BehaviorExecution; flight validation of this entry is pending, and historical timed-path evidence does not validate it.

implementation:
  component_id: aerohub.planner.aerovla
  manifest: deployment/airsim/demos/aerovla_blocks/component.yaml
  shared_runtime: aerovla-planner-adapter
  coupled_capabilities: []

inputs:
  - id: front_rgb
    capability_type: sensor/camera/rgb/image
  - id: down_rgb
    capability_type: sensor/camera/rgb/image
  - id: self_pose
    capability_type: state/self/pose/3d
  - id: self_twist
    capability_type: state/self/twist/3d
  - id: controller_status
    capability_type: control/controller/status

outputs:
  - id: execution_status
    capability_type: task/aerovla/status
  - id: planner_failure
    capability_type: planning/failure

interfaces:
  - id: control
    role: functional_operation
    interaction: managed_task
    protocol: ros2_service
    schema: uav_planner_interfaces/srv/ControlPlanner
    parameter_schema: src/tool/navigation/interfaces/srv/ControlPlanner.srv
  - id: infer
    role: functional_operation
    interaction: request_response
    protocol: ros2_service
    schema: uav_inference_interfaces/srv/InferAeroVla
    parameter_schema: src/basic_function/inference/interfaces/srv/InferAeroVla.srv

lifecycle:
  management: system_managed
  operations: {start: null, status: null, stop: null}

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: compute/npu/houmo-xh2
  - hardware_type: sensor/camera/rgb
  - hardware_type: flight-controller/px4

resource_access:
  reads:
    - sensor/front-camera
    - sensor/down-camera
    - vehicle/self-state
    - vehicle/controller-status
  shared_writes:
    - inference/npu-worker
  exclusive_writes:
    - vehicle/motion

demo:
  representations:
    - id: goto_execution_status
      stage: intermediate
      description: Task-scoped GoTo execution status; native ROS lifecycle verified, flight validation pending.
      interface: {protocol: ros2_topic, schema: std_msgs/msg/String}
      renderer: json
