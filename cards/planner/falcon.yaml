schema_version: "1.0"
id: navigation/falcon-exploration
version: "0.1.0"
type: tool
name: FALCON coverage-guided exploration
description: Explore a bounded unknown environment using hierarchical coverage routing, frontier viewpoints, local collision-aware B-splines, and AS2 timed trajectory execution.

implementation:
  component_id: aerohub.tool.falcon
  manifest: deployment/falcon/component.yaml
  shared_runtime: falcon-planner-adapter
  coupled_capabilities: []

inputs:
  - id: axial_depth
    capability_type: sensor/camera/depth/axial-image
  - id: local_odometry
    capability_type: state/local/odometry/3d

outputs:
  - id: task_status
    capability_type: diagnostics/health/text

interfaces:
  - id: trigger_exploration
    role: functional_operation
    interaction: managed_task
    protocol: ros2_topic
    schema: geometry_msgs/msg/PoseStamped
    parameter_schema: null
  - id: set_execution_enabled
    role: lifecycle_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/SetBool
    parameter_schema: null

lifecycle:
  management: agent_managed
  operations:
    start: set_execution_enabled
    status: null
    stop: set_execution_enabled

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: sensor/camera/depth
  - hardware_type: flight-controller/px4

resource_access:
  reads:
    - drone/self_state
    - drone/depth_camera
  shared_writes: []
  exclusive_writes:
    - drone/motion

demo:
  representations:
    - id: private_occupied_voxels
      stage: intermediate
      description: FALCON private occupied-voxel view used by its exploration planner; not advertised as a reusable map capability.
      interface:
        protocol: ros2_topic
        schema: sensor_msgs/msg/PointCloud2
      renderer: point_cloud_3d
    - id: exploration_frontiers
      stage: intermediate
      description: Current free-to-unknown frontier samples and selected exploration regions.
      interface:
        protocol: ros2_topic
        schema: sensor_msgs/msg/PointCloud2
      renderer: point_cloud_3d
    - id: explored_route
      stage: final
      description: Executed coverage-guided flight route in the fixed local ENU frame.
      interface:
        protocol: ros2_topic
        schema: nav_msgs/msg/Path
      renderer: trajectory_3d
