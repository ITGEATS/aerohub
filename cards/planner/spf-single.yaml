schema_version: "1.0"
id: planner.spf-single
version: "0.4.0"
type: tool
name: SPF language-navigation single-vehicle tool
description: Accepts a natural-language semantic goal and executes single-vehicle closed-loop See-Point-Fly navigation through the shared Vision-Language Inference Function, semantic-depth back-projection and FollowTimedPath rotate/forward segments. The finite timeout includes inference, retries and motion; SPF has no semantic arrival detector, so budget expiry returns TIMEOUT rather than success, and cancellation succeeds only after stop confirmation.

implementation:
  component_id: aerohub.planner.spf-single
  manifest: deployment/airsim/demos/spf_language_nav/component.yaml
  shared_runtime: spf-compute
  coupled_capabilities: []

inputs:
  - id: self_pose
    capability_type: state/self/pose/3d
  - id: fpv_camera_calibration
    capability_type: sensor/camera/rgb/camera-info
  - id: fpv_image
    capability_type: sensor/camera/rgb/image
  - id: vision_language_inference
    capability_type: inference/vision-language/text

outputs:
  - id: task_status
    capability_type: diagnostics/health/text

interfaces:
  - id: to_semantic_goal
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/NavigateToSemanticGoal
    parameter_schema: src/tool/navigation/interfaces/action/NavigateToSemanticGoal.action
  - id: cancel_task
    role: lifecycle_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null
  - id: timed_path_execution
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/FollowTimedPath
    parameter_schema: src/tool/navigation/interfaces/action/FollowTimedPath.action

lifecycle:
  management: agent_managed
  operations:
    start: to_semantic_goal
    status: null
    stop: cancel_task

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: sensor/camera/rgb
  - hardware_type: flight-controller/px4

resource_access:
  reads:
    - sensor/rgb-camera
    - vehicle/self-state
    - inference/vision-language/text
  shared_writes: []
  exclusive_writes:
    - vehicle/motion
