schema_version: "1.0"
id: planner.spf-single
version: "0.4.0"
type: tool
name: SPF language-navigation single-vehicle tool
description: Accepts a natural-language goal and executes closed-loop See-Point-Fly navigation (FPV image -> cloud VLM point + semantic depth -> pinhole back-projection -> rotate/forward timed segments) through the existing FollowTimedPath execution chain.

implementation:
  component_id: aerohub.planner.spf-single
  manifest: deployment/airsim/demos/spf_language_nav/component.yaml
  shared_runtime: spf-compute
  coupled_capabilities: []

inputs:
  - id: self_pose
    capability_type: state/self/pose/3d
  - id: fpv_camera_calibration
    capability_type: sensor/camera/rgb/camera-info
  - id: fpv_image
    capability_type: sensor/camera/rgb/image
    note: consumed by the Inference Function; SPF exchanges model_name/prompt/text and the actual acquisition header
  - id: vision_language_inference
    capability_type: inference/vision-language/text
    note: depends on inference.vision-language; credentials and provider binding are outside this Tool
  - id: sim_clock
    capability_type: state/sim/clock

outputs:
  - id: task_status
    capability_type: task/spf/status

interfaces:
  - id: to_semantic_goal
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/NavigateToSemanticGoal
    parameter_schema: src/tool/navigation/interfaces/action/NavigateToSemanticGoal.action
    note: /<vehicle>/navigate_to_semantic_goal accepts description and required finite positive timeout (monotonic seconds). No arrival detector; budget expiry aborts with TIMEOUT, never SUCCEEDED. Cancellation returns CANCELED only after stop confirmation; an unconfirmed stop returns STOP_UNCONFIRMED. Feedback reports phase, current_pose, steps_completed and revision.
  - id: cancel_task
    role: lifecycle_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null
  - id: timed_path_execution
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/FollowTimedPath
    parameter_schema: src/tool/navigation/interfaces/action/FollowTimedPath.action

lifecycle:
  management: agent_managed
  operations:
    start: send NavigateToSemanticGoal to /<vehicle>/navigate_to_semantic_goal
    status: spf/status snapshot (state, task_id, revision, cycles_done, vlm_attempts, ready)
    stop: Action cancel -> stop acknowledgement + execution result + fresh 3D speed<0.2 m/s held 1 s -> STOPPED; 10 s grace expiry -> FAULT/STOP_UNCONFIRMED requiring operator recovery
  preconditions: fresh pose (<1 s) and CameraInfo (<5 s), execution endpoints ready, live clock, available Inference Function and authorized model binding
  timeout: required finite positive monotonic seconds including VLM waits, retries and motion; stopping has a separate 10 s grace period

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: sensor/camera/rgb
  - hardware_type: flight-controller/px4
  - hardware_type: network/cloud-api

resource_access:
  reads:
    - sensor/rgb-camera
    - vehicle/self-state
    - inference/vision-language/text
  shared_writes: []
  exclusive_writes:
    - vehicle/motion

type_specific:
  navigation_functions:
    supported: [to_semantic_goal]
    unsupported: [to_pose]
  completion: no semantic arrival detector; SPF never reports successful goal attainment
  legacy_debug: spf/goal is not a Navigation function; max_cycles exhaustion returns EXECUTION_FAILED/step_limit, not success
  depth: VLM semantic level 1-10 mapped to metres (depth/10*2, default 4) exactly as upstream (D9); no LiDAR ranging
  step: upstream min_command_duration 2.0 s retained (D5); demo runs base_velocity 1.0 -> 2 m steps for the Blocks corridor
  altitude_floor: min_altitude_m 1.2 clamps commanded t>0 points (D12); upstream-faithful branches keep the unbounded mapping
  synchronization: single vehicle; multi-vehicle spillover declared in src/tool/navigation/planner/spf/README.md but not implemented

validation:
  stage: single-live-navigation-cycle-verified
  current_contract_validation: deployment/airsim/demos/spf_language_nav/live_cloud_validation.md
  evidence:
    - deployment/airsim/demos/spf_language_nav/live_cloud_validation.md
    - deployment/airsim/demos/spf_language_nav/validation.json
    - log/spf/pc-e2e/run-20261116z6/formal1
    - log/spf/pc-e2e/run-20261116z7/cancel1
  limitations:
    - single-live-cycle-only-not-stable-navigation
    - model-empty-responses
    - constant-refactor-ROS-tested-flight-evidence-uses-same-value-config
    - live-stale-and-provider-down-faults-not-tested
    - minimal-acceptance-scope-per-2026-11-16-ruling
    - substitute-VLM-D11-not-comparable-to-paper-numbers
    - single-vehicle-only
    - not-RoboPi-or-real-flight-acceptance
    - evidence-paths-are-developer-local
