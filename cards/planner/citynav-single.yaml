schema_version: "1.0"
id: planner.citynav-single
version: "0.2.0"
type: tool
name: CityNavAgent language-navigation single-vehicle tool
description: |
  Accepts a natural-language goal and executes the migrated CityNavAgent HSPM
  loop (landmark sequence extracted from the instruction by the cloud LLM (D3,
  Blocks has no AirVLN annotation input), five-view viewpoint route query,
  open-vocabulary grounding, metric-depth back-projection to filtered semantic
  point clouds, alpha=0.6 shrunk waypoint) plus an online topology memory graph
  with cross-task exploit (D4/D22), running observe-decide-move cycles and
  executing the upstream 15deg/5m/2m action decomposition as timed segments
  through the shared FollowTimedPath execution chain; no new navigation
  Behavior and no direct Motion Reference publication.
  Loop cadence: one independent is_final FollowTimedPath goal per cycle; the
  fixed five-eye camera array (Yaw -90..+90, D8') streams at 5 Hz with batch
  view_freshness_s=2.0; results are bound to request-time image stamps with
  max_result_age_s=90 (LLM ~10 s + 5x8 s serial grounding cycle envelope, D21).
  Start/stop constraint: the planner process is orchestrated by the demo; it
  requires the shared Inference Function vision-language frames service
  (InferVisionLanguageFrames action; cloud glm-4v-flash behind it, provider
  binding and credentials outside this Tool - Tool-ified 2026-11-18, the
  private workstation llm_proxy package and citynav/llm topics were removed
  and upstream prompts moved verbatim into the planner package), the host
  grounded_sam (:8100) and clip (:8101) HTTP inference services (declared
  deviation D27: still direct host HTTP, not the ROS 2 Inference surface),
  and the flight_board sensor/clock bridge; cancel enters STOPPING, stops the
  Behavior and confirms speed<0.2 m/s for 1 s before STOPPED.
  Shared runtime: the planner node is co-located with the AS2 state
  estimator/controller and the FollowTimedPath Behavior in one compute-role
  container; the Inference Function runs in its own inference-role container.
  Validation status (claim level partial-verification-passed, NOT
  reproduction-success): formal1, cancel1, fault1 and stuck2 minimal
  end-to-end acceptance PASSED 2026-11-18 on AirSim Blocks + PX4 SITL
  under the PRE-Tool-ification contract; after the 2026-11-18 addendum-3
  Tool-ification (to_semantic_goal entry + shared InferVisionLanguageFrames
  cloud-LLM path) formal1 was RE-VERIFIED PASSED under the new contract
  (run-20261118tool12, 12/12 gates, D25 SUCCEEDED reason verified live in
  the action result; unit 53 passed + new-contract DDS lifecycle 6/6);
  2026-11-19 round: fault1 re-verified PASSED (run-20261119f2 - stopped
  inference container, 3x NO_SERVER -> FAULT llm_failures, zero goals, clean
  airborne convergence); cancel1 re-verification 未通过 (four in-flight
  cancelled_stop_gate_timeout runs c8/c9/c10/c11 - the fourth after a full
  host reboot, which ruled out transient driver state: the blocker is the
  systematic EKF hover z limit cycle of the flight_board v0.1.1
  configuration vs the locked 10 s stop gate; the contract's
  STOP_UNCONFIRMED path behaved per spec every time, no gate relaxation,
  retry requires the team-level PX4 tuning ticket); recorded residual: the formal1 pass is attempt-dependent (the
  known wall-crossing decision family - provider VLM randomness + Blocks
  corridor geometry, not a toolification regression - failed 3 of 4 flying
  attempts); see validation.json toolification_20261118 and
  cancel1_fault1_new_contract_20261119 for the full attempt histories;
  M-1 proxy/SDK same-frame agreement PASSED under the revised criterion
  (user ruling 2026-11-18 addendum-2; original >=90% gate result 70% vs
  SDK self-control 80% retained on record). CROSS-TASK MEMORY REUSE IS
  NOT FLIGHT-VALIDATED: the executed-walk segment remains 未完成 (CLIP
  discriminative signal inherently insufficient in the Blocks scene,
  ruling B2) and was downgraded from acceptance mandatory-demo item to a
  follow-up item by user ruling 2026-11-18 addendum-2; graph build/save/
  load/hit/LM-Nav-search stages each have flight evidence, the final
  execute stage does not.
  Boundaries: single vehicle only; per-vehicle spillover needs proxy cache
  keys, memory-graph paths and request_id namespacing isolated per vehicle
  (declared, not implemented). Out of scope by the route-B ruling: the AirVLN
  benchmark, so paper SR/OSR/NE/SPL/SDTD are not claimable.

implementation:
  component_id: aerohub.planner.citynav-single
  manifest: deployment/airsim/demos/citynav_blocks/component.yaml
  shared_runtime: citynav-compute-container
  coupled_capabilities: []

inputs:
  - id: self_pose
    capability_type: state/self/pose/3d
  - id: self_twist
    capability_type: state/self/twist/3d
  - id: five_view_rgb
    capability_type: sensor/camera/rgb/image
  - id: five_view_axial_depth
    capability_type: sensor/camera/depth/axial-image
  - id: five_view_camera_info
    capability_type: sensor/camera/rgb/camera-info
  - id: vision_language_inference
    capability_type: inference/vision-language/text
    note: depends on inference.vision-language; the planner holds the upstream
      prompts verbatim (prompts.py) and sends frames+prompt explicitly; empty
      images = text-only request; semantic parsing (landmark/viewpoint JSON,
      is_found) stays in the planner (D26)

outputs:
  - id: task_status
    capability_type: task/citynav/status
  - id: planning_events
    capability_type: task/citynav/events

interfaces:
  - id: to_semantic_goal
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/NavigateToSemanticGoal
    parameter_schema: src/tool/navigation/interfaces/action/NavigateToSemanticGoal.action
    note: "/<vehicle>/navigate_to_semantic_goal accepts description and required
      finite positive timeout (Tool-ified entry; the private citynav/goal
      String topic is removed; max_steps/use_memory became planner deployment
      parameters). SUCCEEDED semantics per D25 - landmark sequence complete
      under VLM visibility confirmation, reason
      landmark_sequence_complete_semantic_only_no_positional_verification;
      positional arrival is scored offline by the workstation, never claimed.
      Budget expiry returns TIMEOUT, never SUCCEEDED."
  - id: infer_vision_language_frames
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_inference_interfaces/action/InferVisionLanguageFrames
    parameter_schema: src/basic_function/inference/interfaces/action/InferVisionLanguageFrames.action
    note: consumed dependency (client side), served by the shared Inference
      Function; declared here because the prompt/frames contract is this
      Tool's responsibility boundary (D26)
  - id: cancel_task
    role: lifecycle_operation
    interaction: request_response
    protocol: ros2_service
    schema: std_srvs/srv/Trigger
    parameter_schema: null
  - id: timed_path_execution
    role: functional_operation
    interaction: managed_task
    protocol: ros2_action
    schema: uav_planner_interfaces/action/FollowTimedPath
    parameter_schema: src/tool/navigation/interfaces/action/FollowTimedPath.action

lifecycle:
  management: agent_managed
  operations:
    start: send NavigateToSemanticGoal to /<vehicle>/navigate_to_semantic_goal
    status: citynav/status snapshot (state, task_id, revision, step_size,
      next_landmark_idx, landmarks, memory_nodes, failures, ready)
    stop: cancel_task (citynav/cancel) -> STOPPING -> speed-gated STOPPED

hardware_requirements:
  - hardware_type: compute/cpu/x86-64
  - hardware_type: sensor/camera/rgb
  - hardware_type: sensor/camera/depth
  - hardware_type: flight-controller/px4
  - hardware_type: network/cloud-api

resource_access:
  reads:
    - sensor/rgb-camera
    - sensor/depth-camera
    - vehicle/self-state
    - inference/vision-language/text
    - service/grounded-sam-inference
    - service/clip-inference
  shared_writes: []
  exclusive_writes:
    - vehicle/motion
