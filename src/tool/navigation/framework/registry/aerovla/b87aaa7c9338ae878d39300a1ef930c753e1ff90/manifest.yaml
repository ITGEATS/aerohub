id: aerovla
version: b87aaa7c9338ae878d39300a1ef930c753e1ff90
runtime:
  # Board-native planner (no docker on RoboPi); the framework spawns it with
  # the resolved task config. Runs under the aerovla overlay environment
  # (uav_aerovla_planner + uav_planner_framework on PYTHONPATH).
  image: board-native:/data/aerohub/lib/aerovla
  adapter: uav_aerovla_planner.goto_node
  command: [python3, -m, uav_aerovla_planner.goto_node, --ros-args,
            -p, "resolved_config:={resolved_config}",
            -p, "use_sim_time:={use_sim_time}",
            -p, "failure_topic:=/planner/failure"]
parameters:
  defaults: defaults.yaml
  schema: parameters.schema.yaml
capabilities:
  planning_mode: single
  min_vehicles: 1
  max_vehicles: 1
  required_inputs: [front_image, down_image, vehicle_state, vehicle_twist]
output: {type: BehaviorExecution, interface_version: 1}
resources: {gpu_required: false}
platforms: [linux/arm64]
