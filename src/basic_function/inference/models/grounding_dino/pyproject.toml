[project]
name = "aerohub-grounding-dino-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = ["aerohub-inference-runtime", "transformers==4.40.1", "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4", "pillow==12.3.0", "safetensors==0.4.5"]

[tool.uv.sources]
aerohub-inference-runtime = {path = "../../runtime"}
torch = {index = "pytorch-cu124"}
torchvision = {index = "pytorch-cu124"}

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
