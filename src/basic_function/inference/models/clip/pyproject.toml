[project]
name = "aerohub-clip-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aerohub-inference-runtime",
  "torch==2.9.1",
  "transformers>=4.49,<5",
  "numpy",
  "pillow",
  "pyyaml",
]

[tool.uv.sources]
aerohub-inference-runtime = { path = "../../runtime" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
