[project]
name = "aerohub-flowpilot-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["aerohub-inference-runtime", "torch==2.5.1+cu124", "opencv-python-headless==4.10.0.84", "numpy==1.26.4", "einops==0.8.1", "pydantic==2.10.4"]

[tool.uv.sources]
aerohub-inference-runtime = { path = "../../runtime", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
