[project]
name = "aerohub-yopo-tracker-worker"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
  "aerohub-inference-runtime",
  "numpy==1.26.4",
  "ruamel-yaml==0.17.21",
  "scipy==1.11.4",
  "torch==2.6.0+cu124",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
aerohub-inference-runtime = { path = "../../runtime", editable = true }
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
