[project]
name = "aerohub-host-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "modelscope==1.40.3",
  "PyYAML>=6,<7",
  "msgpack>=1,<2",
  "Pillow>=9,<13",
]

[project.optional-dependencies]
# Lock SDK dependencies using its release metadata. The simulator setup entry
# installs the configured native SDK source instead of the registry package.
projectairsim = ["projectairsim==1.1.0", "setuptools>=77", "wheel"]

[tool.uv]
package = false
