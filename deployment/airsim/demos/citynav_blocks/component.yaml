schema_version: '0.1'
id: aerohub.planner.citynav-single
version: '0.1.0'
source:
  upstream: src/tool/navigation/planner/citynav/upstream
  revision: 4b6e926c3325995483576523b18c9d0de5eb0710
  integration: [src/tool/navigation/planner/citynav/ros2_adapter,
                src/tool/navigation/planner/citynav/llm_proxy]
  license: 'Upstream badge declares MIT (CODE_LICENSE file missing - broken link, recorded gap in src/tool/navigation/planner/citynav/README.md); git submodule reference only, internal non-commercial research use'
provides: [planner.citynav-single]
cards: []  # cards/planner/citynav-single.yaml is phase 8 deliverable (not yet authored)
roles:
  compute: [citynav-planner, AS2, FollowTimedPath]
  workstation: [ROS-task-client, citynav-llm-proxy, simulation-collision-scoring]
  simulator: [AirSim, sensor-bridge-five-eye]
  flight_controller: [PX4-SITL]
runtime:
  images: ['ghcr.io/popc0rn7/aerohub/onboard-computer:v0.1.1',
           'ghcr.io/popc0rn7/aerohub/flight-board:v0.1.1',
           'osrf/ros:humble-desktop-full-jammy']
  platform: Windows host (Blocks.exe via schtasks) + Docker Desktop dockerd; containers on --network host inside the VM (see README deviations)
  dependencies: [uav_planner_interfaces, uav_follow_path_execution, uav_citynav_planner,
                 uav_citynav_llm_proxy, ROS-2-Humble, AirSim-Blocks, PX4-SITL,
                 grounded_sam-service(:8100), clip-service(:8101), cloud-LLM(glm-4v-flash)]
  build: 'run.py prepare (colcon overlay into log/citynav/pc-e2e/ros_ws; shared images untouched, per AGENTS overlay policy)'
  launch: deployment/airsim/demos/citynav_blocks/run.py
  configuration: deployment/airsim/demos/citynav_blocks/planner.yaml (run.py rewrites __HOST__ into <output>/planner.yaml)
  camera_rate_hz: 5.0
  sensors: deployment/airsim/demos/citynav_blocks/settings.json (City* five-eye array, ImageType 0+1, 256x256, FOV 90; ImageType 2 forbidden by contract)
  inference: 'GPU services run on the Windows host (0.0.0.0:8100/8101); containers reach them via the address chosen by host_probe.py (host.docker.internal or vEthernet IPv4), recorded in topology.json'
  vlm: 'cloud OpenAI-compatible endpoint (glm-4v-flash, substitute model); proxy on workstation, images never leave the PC network namespace except to the API'
  overlay: log/citynav/pc-e2e/ros_ws/install
  workstation_overlay: log/citynav/pc-e2e/workstation/ws/install
  clock: AirSim-clock-bridge (SteppableClock, best-effort /clock)
  domain: selected-unused-180-to-199-recorded-in-each-domain.json
  readiness: fresh-clock-pose-CityFront-camera-info-plus-citynav-status-ready
  stop: ROS-citynav/cancel-then-STOPPED-speed-gate-before-native-Land (reserved --cancel-after; not exercised in formal1)
  persistence: 'log/citynav/pc-e2e (memory graph per run: <run>/citynav_memory.json)'
resources:
  motion: exclusive-drone0-FollowTimedPath-session
  gpu: required-on-host (grounded_sam + clip services; formal1 must not mock them)
  tf_authority: AS2-self-localization-and-sensor-static-bridge
validation:
  evidence: deployment/airsim/demos/citynav_blocks/validation.json
  status: formal1 (run-20261118g) and cancel1 (run-20261118n) minimal end-to-end acceptance PASSED 2026-11-18; exploit1 BLOCKED (CLIP margin + hover z limit cycle + host startup deaths, see validation.json); claim level partial-verification-passed, not reproduced
  limitations: [exploit-reuse-blocked-executed-walk, full-matrix-open, single-vehicle-only, no-AirVLN-benchmark-route-B,
                substitute-VLM-model, board-deployment-open, blocks-scene-not-urban-city,
                host-precondition-grounded-sam-GS_EMPTY_CACHE, hover-z-limit-cycle-post-takeoff]
