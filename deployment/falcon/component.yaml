schema_version: "0.1"
id: aerohub.tool.falcon
version: "0.2.0"
source:
  upstream: src/tool/navigation/planner/falcon/upstream
  upstream_baseline: 312eb4d32c6c7af1a482f94a0a204aa2bb150cca
  fork: https://github.com/Air-Suck/FALCON.git
  fork_branch: aerohub-ros2
  fork_revision: b447c1b660ab2305c023a38121fb4feeea44e47b
  integration: src/tool/navigation/planner/falcon/ros2_adapter
  license: unresolved-upstream-ros1-noetic-branch-has-no-root-license-and-manifests-say-TODO
provides:
  - navigation/falcon-exploration
cards:
  - cards/planner/falcon.yaml
roles:
  simulator:
    - AirSim
  flight_controller:
    - image-embedded-PX4-SITL
  compute:
    - falcon_ros2
    - uav_falcon_adapter
    - AS2
    - FollowTimedPath
  workstation:
    - ROS-task-and-acceptance-client
runtime:
  platform: linux-x86_64
  compute_build_base: onboard_computer:v0.1.1
  workstation_build_base: osrf/ros:humble-desktop-full-jammy
  compute_image: aerohub/falcon:ros2-humble
  workstation_image: aerohub/falcon-workstation:ros2-humble
  flight_image: flight_board:v0.1.0
  dependencies:
    - ROS-2-Humble
    - Eigen3
    - PCL
    - OpenCV
    - NLopt-2.7.1
    - google-glog
    - libdw
    - uav_planner_interfaces
    - uav_follow_path_execution
  build: bash deployment/falcon/build.sh
  check: bash deployment/falcon/check.sh
  launch: python3 deployment/falcon/run.py
  install_prefix: /opt/falcon_ws/install
  runtime_policy: self-contained-images-with-only-generated-config-and-evidence-mounts
  clock: ROS-clock-from-AirSim
  namespace: drone0
  readiness: fresh-timestamp-paired-depth-and-odometry-map-frontier-and-FollowTimedPath-ready
  stop: adapter-stop-service-plus-FollowTimedPath-stop-confirmation
  rollback: stop-confirm-land-and-disarm-then-restore-locked-parent-and-fork-revisions
interfaces:
  inputs:
    axial_depth: /drone0/sensor_measurements/FrontCamera/depth_planar/image
    local_odometry: /drone0/sensor_measurements/odom
  operations:
    enable: /drone0/falcon/enable
    trigger: /move_base_simple/goal
    execution: /drone0/follow_timed_path
  status: /drone0/falcon/adapter/state
resources:
  reads:
    - authority-local-odometry
    - calibrated-axial-depth
  writes:
    - FollowTimedPath-session
  coupling: planner-map-and-execution-adapter-share-one-task-generation-and-must-not-restart-independently-in-flight
  conflicts:
    - other-motion-behaviors
    - duplicate-FALCON-runtime
validation:
  stage: reproduced
  scope: Native ROS 2 Humble self-contained compute and workstation images passed the visible AirSim + image-embedded PX4 SITL normal, depth-loss and planner-exit matrix without host source or build/install mounts.
  image: sha256:57d923b4315f0d41165181b28a9977ebe61b2662d280abcd518e07a96d690e3e
  workstation_image: sha256:3eb4ad8667859b06b78eedf9e0c50710ae316b886b89a4e5cdd73770a3604f00
  flight_image: sha256:1eff3190ca7870d0267ddb1531365dd7c68d85c6e52ade3d25b17b84b4758843
  source_digest: 3e9e67ed9b8676aff3a76d7c34745beed26be75acb024f38218048a6280edd6f
  evidence:
    - log/falcon/self-contained-final-normal-r1/result.json
    - log/falcon/self-contained-final-normal-r1/runtime-mounts.json
    - log/falcon/self-contained-final-normal-r1/cleanup.json
    - log/falcon/self-contained-final-depth-loss-r1/result.json
    - log/falcon/self-contained-final-depth-loss-r1/runtime-mounts.json
    - log/falcon/self-contained-final-depth-loss-r1/cleanup.json
    - log/falcon/self-contained-final-planner-exit-r1/result.json
    - log/falcon/self-contained-final-planner-exit-r1/runtime-mounts.json
    - log/falcon/self-contained-final-planner-exit-r1/cleanup.json
  required_cases:
    - normal-complete-exploration
    - depth-stream-loss
